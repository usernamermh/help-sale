# ═══════════════════════ 助销 Agent 统一配置 ═══════════════════════
# 所有运行时配置都在这个文件里;环境变量可临时覆盖(见 apps/api/.env.example)

# ───────────────────────── 服务监听 ─────────────────────────
server:
  host: 0.0.0.0
  port: 3101

# ───────────────────────── 数据存储 ─────────────────────────
data:
  # 数据存储模式(二者只取其一,不允许双写):
  #   local - 本地 SQLite 单一主库(默认;MySQL 归档双写关闭)
  #   mysql - 远程 MySQL 主库(需先完成仓库层 MySQL 迁移,当前版本启动即报错提示)
  # 配置只从本文件读取,不支持环境变量覆盖(CONFIG_PATH 除外)
  mode: local
  # 库标识:本地库与远程库的统一业务标识(mysql 模式对应 mysql.database)
  databaseId: help_sale
  # 业务表名映射(默认值与 db/schema.sql 建表名一致;切换 mysql 模式时按远程库实际表名调整,
  # 仓库层经 src/db/tables.ts 统一引用)
  tables:
    tenants: tenants
    customers: customers
    conversations: conversations
    conversation_messages: conversation_messages
    analyses: analyses
    next_step_tasks: next_step_tasks
    knowledge_documents: knowledge_documents
    knowledge_chunks: knowledge_chunks
    knowledge_candidates: knowledge_candidates
    agent_events: agent_events
    customer_tags: customer_tags
    notification_logs: notification_logs
    stores: stores
    sales: sales
    deals: deals
    tool_call_cache: tool_call_cache
    digests: digests
  # 业务库与会话库所在的目录(相对仓库根;可用 DATA_DIR 环境变量覆盖)
  dataDir: apps/api/data
  # 记忆文件:系统/用户记忆以 Markdown 落盘,构建 Agent 系统提示词时拼接
  memoryFile: apps/api/data/memory.md
  # 业务 SQLite 库路径(相对仓库根;BUSINESS_DB 可覆盖),业务库 = dataDir + 文件名
  businessDbPath: apps/api/data/business.db
  # pi 会话库路径(相对仓库根;SESSION_DB 可覆盖)
  sessionDbPath: apps/api/data/pi-sessions.db

# ───────────────────────── 多租户 ─────────────────────────
tenant:
  # 默认租户 ID:请求未带 x-tenant-id 头时使用(MVP 固定租户)
  defaultTenantId: t_demo

# ───────────────────────── 模型接入 ─────────────────────────
model:
  # 提供方:local-llm(内网 OpenAI 兼容端点)/ deepseek / openai
  provider: local-llm
  # 模型名:网关聚合模型之一(deepseek-v4-flash-0731 默认;备选 deepseek-v4-pro-0813 / gpt-5.2 / u21-preview 弱模型端点)
  modelId: your-model-id
  # OpenAI 兼容端点根地址(以 /v1 结尾,不含 /chat/completions)
  baseUrl: http://your-llm-gateway/v1
  # API key:模型网关 key
  apiKey: your-api-key
  # 访问模型的 HTTP 代理(内网受限时使用;为空表示直连)
  proxy: ""
  # 模型上下文窗口(token 数),向端点声明容量
  contextWindow: 80000
  # 单次回复最大输出 token 数
  maxTokens: 8192
  # 额外请求参数:会统一放进请求体 body 的 extra_body 字段,
  # 与标准 OpenAI 参数(model/messages/stream/tools…)不混杂、不平级。
  # 示例(去掉注释并保持 2 空格缩进即生效):
  # extraBody:
  #   temperature: 0.7
  #   top_p: 0.9
  #   repetition_penalty: 1.05
  extraBody: {}

# ───────────────────────── 知识库分块 ─────────────────────────
chunker:
  # 每个知识块的目标字符数(过长的段落会按此切分)
  size: 600
  # 相邻知识块之间的重叠字符数,保证跨块上下文不丢失
  overlap: 80

# ───────────────────────── 知识检索 ─────────────────────────
knowledge:
  # 每次发起检索默认返回的命中条数(1-10)
  searchLimit: 5


# ───────────────────────── 本地日志 ─────────────────────────
logging:
  # 是否启用模型输入输出本地日志(请求体/响应/推理过程写入 NDJSON)
  enabled: true
  # 日志目录(相对仓库根;LOG_DIR 环境变量可覆盖),模型调用日志写入 <dir>/model-calls.log
  dir: apps/api/log
  # 单个日志文件轮转上限(字节),超过后保留最近一半
  maxBytes: 8388608

# ───────────────────────── 业务默认值 ─────────────────────────
# 所有运行默认值统一在此配置,代码内不再写死默认参数
defaults:
  # 经营洞察默认窗口(天)
  insightsDays: 7
  # 规则改进聚合默认窗口(天)
  improvementsDays: 30
  # 会话列表默认条数
  conversationsLimit: 30
  # 成交列表默认条数
  dealsLimit: 100
  # 门店概览默认时间窗口(天)
  storeOverviewDays: 30
  # 客户清单默认条数
  customersLimit: 50
  # 知识沉淀候选默认条数
  knowledgeCandidatesLimit: 50
  # Agent 线程列表默认条数
  agentThreadsLimit: 30
  # 会话原文默认读取条数上限
  transcriptLimit: 50
  # Agent 列表类工具默认条数(会话/任务/候选)
  agentListLimit: 20
  # 通知到期提醒每次扫描的最大记录数
  notificationScanLimit: 50
  # 到期提醒队列单次取出条数上限
  remindersTakeLimit: 100
  # 客户历史分析工具默认条数
  analysisHistoryLimit: 5
  # 车型检索工具默认条数
  vehicleSearchLimit: 10
# ───────────────────────── 中间件:MySQL 归档仓库 ─────────────────────────
mysql:
  # data.mode=mysql 时用作业务主库;local 模式不使用
  enabled: true
  # 建库前是否重建全部业务表(mysql 模式初始化/表结构升级用;true 会清空远程业务表,MYSQL_SCHEMA_REBUILD 可覆盖)
  schemaRebuild: false
  # 连接超时(毫秒;MYSQL_CONNECT_TIMEOUT 可覆盖)
  connectTimeout: 8000
  # 可选:远程 MySQL 连接参数(部署环境填写)
  host: your-mysql-host
  port: 3306
  user: root
  password: change-me
  database: help_sale

# ───────────────────────── 中间件:Redis 到期提醒队列 ─────────────────────────
redis:
  # 是否启用跟进任务到期提醒(关闭则退化为内存队列)
  enabled: true
  # 可选:远程 Redis 连接参数(部署环境填写)
  host: your-mysql-host
  port: 6379
  password: change-me


# ───────────────────────── 通知推送 ─────────────────────────
notification:
  # 到期提醒推送开关
  enabled: true
  # Webhook 地址:到期任务会 POST JSON 到该地址;留空则只记录日志不推送
  webhookUrl: ""


# ───────────────────────── 自动任务(定时主动工作) ─────────────────────────
automation:
  # 总开关:false 时定时调度器不启动(手动触发接口仍可用)
  enabled: true
  # 每日晨报自动生成时间(HH:MM,服务器本地时间)
  morningDigestTime: "08:00"
  # 周报汇总:星期几(1=周一 … 7=周日)与生成时间
  weeklyReportWeekday: 1
  weeklyReportTime: "09:00"
  # 沉默客户判定天数与每日自动建唤醒任务开关/时间
  silentCustomerDays: 7
  silentWakeupEnabled: true
  wakeupTaskTime: "08:30"
# ───────────────────────── 公司与团队 ─────────────────────────
company:
  # 公司名称:写入系统提示词与客户档案上下文
  name: 你的公司
  # 团队名称:写入系统提示词
  team: 销售团队

userkey: test