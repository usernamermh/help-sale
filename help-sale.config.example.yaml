server:
  host: 0.0.0.0
  port: 3101
data:
  mode: local
  databaseId: help_sale
  tables:
    tenants: tenants
    customers: customers
    conversations: conversations
    conversation_messages: conversation_messages
    next_step_tasks: next_step_tasks
    knowledge_documents: knowledge_documents
    knowledge_chunks: knowledge_chunks
    knowledge_candidates: knowledge_candidates
    agent_events: agent_events
    customer_tags: customer_tags
    notification_logs: notification_logs
    stores: stores
    sales: sales
    deals: deals
    tool_call_cache: tool_call_cache
    digests: digests
  dataDir: backend/data
  memoryFile: backend/data/memory.md
  businessDbPath: backend/data/business.db
  sessionDbPath: backend/data/pi-sessions.db
tenant:
  defaultTenantId: t_demo
  # 是否允许用请求头声明租户(开发/内网方便,生产建议 false:只认 API Key 或登录令牌)
  headerTenantAllowed: true
  # 受信租户清单:非空时,请求头声明的租户必须在这里面,否则 403
  trustedTenantIds: ["t_demo"]
  # 数据隔离模式:off=不检查 / warn=只告警 / enforce=缺 tenant_id 谓词直接拦下
  dataIsolationMode: "enforce"
  # 集成方 API Key → 租户 ID 的映射,值放密钥文件(tenant.apiKeys),这里留空
  apiKeys: {}
model:
  modelId: your-model-id
  baseUrl: http://your-llm-gateway/v1
  apiKey: ${SECRETS:model.apiKey}
  proxy: ""
  contextWindow: 80000
  maxTokens: 8192
  extraBody: {}
context:
  compression:
    enabled: true
    thresholdRatio: 0.7
    keepHead: 2
    keepTail: 20
    minMessages: 10
    maxSummaryChars: 1200
chunker:
  size: 600
  overlap: 80
tools:
  webSearch:
    apiKey: ${SECRETS:tools.webSearch.apiKey}
  fileWrite:
    allowOutsideRepo: true
  sql:
    maxRows: 200
    timeoutMs: 15000
    extraBlockedKeywords: []
    # 高危工具:能执行命令 / 控制机器 / 写任意路径,默认不挂载,需在控制台按租户显式开启
  risk:
    dangerousTools: ["terminal", "computer", "file_write"]
    # false = 高危工具默认关闭(推荐);true = 沿用"没关就是开"的旧行为
    dangerousDefaultEnabled: false
  catalog:
    enabled: true
    threshold: 20
    topK: 8
    maxInspect: 3
    semanticFloorZh: 0.45
    semanticFloorEn: 0.6
    bilingual:
      enabled: true
      rewriteTimeoutMs: 20000
      perLanguageTopK: 8
mcp:
  servers: []
knowledge:
  searchLimit: 5
vector:
  enabled: false
  provider: milvus
  baseUrl: http://127.0.0.1:19530
  database: default
  collection: help_sale_kb
  token: ""
  dimension: 512
  metricType: COSINE
  indexType: IVF_FLAT
  indexNlist: 128
  searchTopK: 5
  scoreThreshold: 0.72
  timeoutMs: 8000
  embedBatch: 64
milvus_backend:
  common:
    storageType: local
    security:
      authorizationEnabled: false
  localStorage:
    path: /var/lib/milvus/data/
  metastore:
    type: etcd
  etcd:
    endpoints:
      - 127.0.0.1:2379
    requestTimeout: 10000
  rocksmq:
    path: /var/lib/milvus/rdb_data/
    retentionSizeInMB: 4096
  queryNode:
    mmap:
      vectorField: false
      vectorIndex: false
      scalarField: false
      scalarIndex: false
      chunkCache: false
  dataNode:
    segment:
      syncPeriod: 300
  indexCoord:
    bindIndexNodeMode:
      enable: false
  log:
    level: info
    file:
      rootPath: /var/lib/milvus/logs
      maxSize: 64
      maxBackups: 5
    stdout: true
milvus_docker_compose:
  name: rmh_milvus
  services:
    rmh-milvus-etcd:
      image: quay.io/coreos/etcd:v3.5.14
      container_name: rmh-milvus-etcd
      restart: unless-stopped
      network_mode: host
      user: 0:0
      environment:
        ETCD_AUTO_COMPACTION_MODE: revision
        ETCD_AUTO_COMPACTION_RETENTION: "1000"
        ETCD_QUOTA_BACKEND_BYTES: "4294967296"
        ETCD_BACKEND_BATCH_LIMIT: "5000"
        ETCD_BACKEND_BATCH_INTERVAL: 50ms
        ETCD_HEARTBEAT_INTERVAL: "500"
        ETCD_ELECTION_TIMEOUT: "2500"
      volumes:
        - ./etcd:/etcd
      command:
        - /usr/local/bin/etcd
        - --name=rmh-milvus-etcd
        - --data-dir=/etcd
        - --initial-cluster-state=new
        - --initial-cluster=rmh-milvus-etcd=http://127.0.0.1:2380
        - --listen-client-urls=http://127.0.0.1:2379
        - --advertise-client-urls=http://127.0.0.1:2379
        - --listen-peer-urls=http://127.0.0.1:2380
        - --initial-advertise-peer-urls=http://127.0.0.1:2380
        - --max-request-bytes=10485760
      healthcheck:
        test:
          - CMD
          - /usr/local/bin/etcdctl
          - --endpoints=http://127.0.0.1:2379
          - endpoint
          - health
        interval: 30s
        timeout: 20s
        retries: 5
        start_period: 20s
    rmh-milvus:
      image: milvusdb/milvus:v2.4.15
      container_name: rmh-milvus
      restart: unless-stopped
      network_mode: host
      depends_on:
        rmh-milvus-etcd:
          condition: service_healthy
      command:
        - milvus
        - run
        - standalone
      environment:
        ETCD_ENDPOINTS: 127.0.0.1:2379
        COMMON_STORAGETYPE: local
        LOCALSTORAGE_PATH: /var/lib/milvus/data/
        ROCKSMQ_PATH: /var/lib/milvus/rdb_data/
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      volumes:
        - ./milvus/data:/var/lib/milvus/data
        - ./milvus/rdb_data:/var/lib/milvus/rdb_data
        - ./milvus/lock:/var/lib/milvus/lock
        - ./milvus/logs:/var/lib/milvus/logs
        - ./user.yaml:/milvus/configs/user.yaml:ro
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:9091/healthz
        interval: 30s
        timeout: 20s
        retries: 10
        start_period: 90s
workflows:
  mine:
    days: 14
    minWindow: 2
    maxWindow: 4
    minCount: 2
    topChains: 8
    refineTop: 3
    dedupe: true
logging:
  enabled: true
  dir: log
  level: info
  runtimeFile: runtime.log
  maxBytes: 8388608
subagents:
  maxConcurrency: 2
  # 有任务在跑时的扫描间隔(毫秒);空闲时不轮询
  pollIntervalMs: 2000
  # 空闲兜底扫描间隔(毫秒):0 = 完全事件驱动(新建卡片会立即唤醒消费者)
  idleSweepIntervalMs: 0
  timeoutMs: 600000
  defaultTools:
    - knowledge_search
    - customer_query
defaults:
  insightsDays: 7
  improvementsDays: 30
  conversationsLimit: 30
  dealsLimit: 100
  storeOverviewDays: 30
  customersLimit: 50
  knowledgeCandidatesLimit: 50
  agentThreadsLimit: 30
  transcriptLimit: 50
  agentListLimit: 20
  notificationScanLimit: 50
  remindersTakeLimit: 100
mysql:
  enabled: true
  schemaRebuild: false
  connectTimeout: 8000
  host: your-mysql-host
  port: 3306
  user: ${SECRETS:mysql.user}
  password: ${SECRETS:mysql.password}
  database: help_sale
redis:
  enabled: true
  host: your-mysql-host
  port: 6379
  password: ${SECRETS:redis.password}
notification:
  enabled: true
  webhookUrl: ""
automation:
  enabled: true
  morningDigestTime: 08:00
  weeklyReportWeekday: 1
  weeklyReportTime: 09:00
  silentCustomerDays: 7
  silentWakeupEnabled: true
  wakeupTaskTime: 08:30
company:
  name: 你的公司
  team: 销售团队
userkey: test
client:
  workflowMineTimeoutMs: 120000
weixin:
  enabled: false
  baseUrl: https://ilinkai.weixin.qq.com
  accountId: ""
  token: ""
  tenantId: t_demo
  botType: "3"
  maxMessageLength: 2000
  sendRetries: 2
  sendRetryDelayMs: 1500
  pollTimeoutMs: 35000
  dedupTtlSeconds: 300
  agentTimeoutMs: 180000
  autoReply: true
  ackText: 收到，正在处理，请稍等。
  unsupportedText: 目前只支持文字消息，图片和语音请稍后再试。
  commandsEnabled: true
  sessionsLimit: 10
  allowFrom: []
