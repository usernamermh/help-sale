name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 构建 pi agent 运行时(离线模型数据)
        run: |
          npm ci --prefix pi --ignore-scripts
          node scripts/gen-minimal-model-data.mjs
          npm run build:offline --prefix pi
          npm install --ignore-scripts
      - name: 类型检查
        run: npm run typecheck --prefix apps/api
      - name: 全量测试
        run: npm test --prefix apps/api