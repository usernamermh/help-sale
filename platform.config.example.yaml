server:
  host: 0.0.0.0
  port: 3101
data:
  mode: local
  databaseId: help_sale
  tables:
    tenants: tenants
    customers: customers
    knowledge_documents: knowledge_documents
    knowledge_chunks: knowledge_chunks
    next_step_tasks: next_step_tasks
    digests: digests
    knowledge_candidates: knowledge_candidates
    agent_events: agent_events
    customer_tags: customer_tags
    notification_logs: notification_logs
    conversations: conversations
    agent_threads: agent_threads
    agent_thread_messages: agent_thread_messages
    agent_capabilities: agent_capabilities
    workflows: workflows
    stores: stores
    sales: sales
    conversation_messages: conversation_messages
    deals: deals
    tool_call_cache: tool_call_cache
    automation_runs: automation_runs
    reflection_cases: reflection_cases
    thread_summaries: thread_summaries
    agent_plans: agent_plans
    automation_jobs: automation_jobs
    builtin_job_settings: builtin_job_settings
    kanban_cards: kanban_cards
    keywords: keywords
    keyword_categories: keyword_categories
    workflow_runs: workflow_runs
    keyword_hits: keyword_hits
    knowledge_embeddings: knowledge_embeddings
    weixin_users: weixin_users
    weixin_messages: weixin_messages
    weixin_threads: weixin_threads
    users: users
    tenant_secrets: tenant_secrets
    tenant_config: tenant_config
    platform_admins: platform_admins
  dataDir: backend/data
  memoryFile: backend/data/memory.md
  businessDbPath: backend/data/business.db
  sessionDbPath: backend/data/pi-sessions.db
platform:
  defaultTenantId: t_demo
  # 是否允许用请求头声明租户(开发/内网方便,生产建议 false:只认 API Key 或登录令牌)
  headerTenantAllowed: true
  # 数据隔离模式:off=不检查 / warn=只告警 / enforce=缺 tenant_id 谓词直接拦下
  dataIsolationMode: "enforce"
  # 集成方 API Key → 租户 ID 的映射,值放密钥文件(tenant.apiKeys),这里留空
  apiKeys: {}
  # 每租户限流与并发配额:保证单个租户吃不满共享资源(无 Redis 时退化为进程内计数)
  rateLimit:
    enabled: true
    # 每租户每分钟请求上限(令牌桶)
    requestPerMinute: 600
    # 令牌桶突发容量
    requestBurst: 120
    # 每租户同时在跑的 agent 轮次上限
    agentConcurrency: 3
    # 被限流时返回的 Retry-After(秒)
    retryAfterSeconds: 5
auth:
  # 登录与 RBAC:开启后业务接口必须带登录令牌(Authorization: Bearer <token>),集成方仍可用 API Key
  enabled: true
  # 登录令牌有效期(小时)
  tokenTtlHours: 12
  # 令牌签名密钥(放密钥文件)
  tokenSecret: ${SECRETS:auth.tokenSecret}
  # 初始管理员:启动时该租户若没有启用的管理员,就按这里创建一个(幂等,登录后请改密码)
  # 总部平台管理员:管所有门店(开门店/停用/清数据/跨店汇总),密码放密钥文件
  platformUsername: hq-admin
  platformPassword: ${SECRETS:auth.platformPassword}
  defaultStoreAdmin:
    tenantId: t_demo
    username: admin
    password: ${SECRETS:auth.defaultStoreAdmin.password}
vector:
  enabled: false
  provider: milvus
  baseUrl: http://127.0.0.1:19530
  database: default
  collection: help_sale_kb
  token: ""
  dimension: 512
  metricType: COSINE
  indexType: IVF_FLAT
  indexNlist: 128
  searchTopK: 5
  scoreThreshold: 0.72
  timeoutMs: 8000
  embedBatch: 64
milvus_backend:
  common:
    storageType: local
    security:
      authorizationEnabled: false
  localStorage:
    path: /var/lib/milvus/data/
  metastore:
    type: etcd
  etcd:
    endpoints:
      - 127.0.0.1:2379
    requestTimeout: 10000
  rocksmq:
    path: /var/lib/milvus/rdb_data/
    retentionSizeInMB: 4096
  queryNode:
    mmap:
      vectorField: false
      vectorIndex: false
      scalarField: false
      scalarIndex: false
      chunkCache: false
  dataNode:
    segment:
      syncPeriod: 300
  indexCoord:
    bindIndexNodeMode:
      enable: false
  log:
    level: info
    file:
      rootPath: /var/lib/milvus/logs
      maxSize: 64
      maxBackups: 5
    stdout: true
milvus_docker_compose:
  name: rmh_milvus
  services:
    rmh-milvus-etcd:
      image: quay.io/coreos/etcd:v3.5.14
      container_name: rmh-milvus-etcd
      restart: unless-stopped
      network_mode: host
      user: 0:0
      environment:
        ETCD_AUTO_COMPACTION_MODE: revision
        ETCD_AUTO_COMPACTION_RETENTION: "1000"
        ETCD_QUOTA_BACKEND_BYTES: "4294967296"
        ETCD_BACKEND_BATCH_LIMIT: "5000"
        ETCD_BACKEND_BATCH_INTERVAL: 50ms
        ETCD_HEARTBEAT_INTERVAL: "500"
        ETCD_ELECTION_TIMEOUT: "2500"
      volumes:
        - ./etcd:/etcd
      command:
        - /usr/local/bin/etcd
        - --name=rmh-milvus-etcd
        - --data-dir=/etcd
        - --initial-cluster-state=new
        - --initial-cluster=rmh-milvus-etcd=http://127.0.0.1:2380
        - --listen-client-urls=http://127.0.0.1:2379
        - --advertise-client-urls=http://127.0.0.1:2379
        - --listen-peer-urls=http://127.0.0.1:2380
        - --initial-advertise-peer-urls=http://127.0.0.1:2380
        - --max-request-bytes=10485760
      healthcheck:
        test:
          - CMD
          - /usr/local/bin/etcdctl
          - --endpoints=http://127.0.0.1:2379
          - endpoint
          - health
        interval: 30s
        timeout: 20s
        retries: 5
        start_period: 20s
    rmh-milvus:
      image: milvusdb/milvus:v2.4.15
      container_name: rmh-milvus
      restart: unless-stopped
      network_mode: host
      depends_on:
        rmh-milvus-etcd:
          condition: service_healthy
      command:
        - milvus
        - run
        - standalone
      environment:
        ETCD_ENDPOINTS: 127.0.0.1:2379
        COMMON_STORAGETYPE: local
        LOCALSTORAGE_PATH: /var/lib/milvus/data/
        ROCKSMQ_PATH: /var/lib/milvus/rdb_data/
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      volumes:
        - ./milvus/data:/var/lib/milvus/data
        - ./milvus/rdb_data:/var/lib/milvus/rdb_data
        - ./milvus/lock:/var/lib/milvus/lock
        - ./milvus/logs:/var/lib/milvus/logs
        - ./user.yaml:/milvus/configs/user.yaml:ro
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:9091/healthz
        interval: 30s
        timeout: 20s
        retries: 10
        start_period: 90s
logging:
  enabled: true
  dir: log
  level: info
  runtimeFile: runtime.log
  maxBytes: 8388608
mysql:
  enabled: true
  schemaRebuild: false
  # 启动时是否允许自动做结构变更(建表/补列/补索引/升类型)。
  # false = 只做只读结构自检,发现差异只告警不执行 —— 配合最小权限数据库账号(scripts/mysql-grants.sql)时的推荐值
  autoMigrate: true
  connectTimeout: 8000
  # 查询连接池大小(每租户不抢连接的前提下放宽;小池会让一个慢查询占满)
  connectionLimit: 20
  # 业务查询超时(毫秒;与 tools.sql.timeoutMs 分开,这里管业务库查询)
  queryTimeoutMs: 15000
  host: your-mysql-host
  port: 3306
  user: ${SECRETS:mysql.user}
  # SQL 工具的只读账号:读路径走它(只有 SELECT);留空则读仍走上面的主账号
  readOnlyUser: ${SECRETS:mysql.readOnlyUser}
  readOnlyPassword: ${SECRETS:mysql.readOnlyPassword}
  password: ${SECRETS:mysql.password}
  database: help_sale
redis:
  enabled: true
  host: your-mysql-host
  port: 6379
  # 主实例锁租约(毫秒):Redis 可用时,定时任务与微信长轮询只在持锁实例上运行
  leaderLeaseMs: 30000
  password: ${SECRETS:redis.password}
notification:
  enabled: true
  webhookUrl: ""
userkey: test
client:
  workflowMineTimeoutMs: 120000
