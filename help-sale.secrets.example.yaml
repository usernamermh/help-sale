# 账户与密钥模板:复制成 help-sale.secrets.yaml 后填真实值(该文件不入库)。
#
# 这一层只放"账户名/密码/密钥"一类,部署/云端管理员负责下发;其余运行参数都在 help-sale.config.yaml。
# 也可以不用这个文件,改在主配置里写 ${ENV:变量名},由部署环境注入环境变量。

# 模型网关密钥(主配置 model.apiKey 引用这里)
model:
  apiKey: ""

# 外部检索密钥(web_search 工具的启用门槛;留空则该工具不挂载)
tools:
  webSearch:
    apiKey: ""

# 业务库账号(建议给应用单独建 DML 账号,别用 root;建号脚本见 scripts/mysql-grants.sql)
mysql:
  user: ""
  password: ""

# 中间件
redis:
  password: ""

# 外部 MCP Server 的个人令牌,按 server 名对应主配置里的 mcp.servers[].name
mcp:
  servers:
    github: ""

# 微信 iLink 机器人账号(通常由扫码登录写入 data/weixin/account.json,这里一般留空)
weixin:
  accountId: ""
  token: ""