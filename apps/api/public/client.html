<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售军师 · 客户端</title>
<style>
:root { --bg:#eef2f8; --bg2:#e2e8f0; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b; --brand:#2563eb; --brand2:#3b82f6; --shadow:0 8px 28px rgba(15,23,42,.07); --radius:16px; }
* { box-sizing:border-box; }
body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:linear-gradient(160deg,#eef2f8 0%,#e7edf7 55%,#eef4ff 100%); color:var(--text); -webkit-font-smoothing:antialiased; }
header { display:flex; align-items:center; gap:14px; padding:14px 28px; background:linear-gradient(120deg,#1e3a8a 0%,#2563eb 55%,#4f46e5 100%); color:#fff; box-shadow:0 2px 16px rgba(30,58,138,.28); position:sticky; top:0; z-index:50; }
header h1 { font-size:20px; margin:0; letter-spacing:.5px; display:flex; align-items:center; gap:9px; }
header h1::before { content:""; width:11px; height:11px; border-radius:3px; background:linear-gradient(135deg,#60a5fa,#c4b5fd); box-shadow:0 0 10px rgba(147,197,253,.8); }
header .sub { font-size:12px; opacity:.85; }
.header-left { display:flex; align-items:center; gap:8px; margin-left:14px; }
header .nav { margin-left:auto; font-size:12px; display:flex; align-items:center; gap:8px; }
.hdr-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.30); background:rgba(255,255,255,.12); color:#fff; border-radius:999px; padding:6px 14px; font-size:12.5px; font-family:inherit; cursor:pointer; backdrop-filter:blur(8px); box-shadow:0 1px 4px rgba(15,23,42,.16); transition:all .2s ease; }
.hdr-btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.hdr-btn:hover { background:rgba(255,255,255,.26); border-color:rgba(255,255,255,.55); transform:translateY(-1px); box-shadow:0 4px 12px rgba(15,23,42,.24); }
.hdr-btn.active { background:#fff; color:#1d4ed8; border-color:#fff; box-shadow:0 4px 14px rgba(30,58,138,.35); }
.hdr-btn.active svg { stroke:#1d4ed8; }
header .nav a { color:#fff; opacity:.9; text-decoration:none; }
.client-layout { display:flex; gap:14px; width:100%; max-width:none; margin:18px auto; padding:0 24px; height:calc(100vh - 82px); min-height:520px; }
.side { width:250px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; overflow:hidden; min-height:0; }
.side-block { background:var(--card); border:1px solid rgba(226,232,240,.9); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; min-height:0; flex:1 1 0; overflow:hidden; box-shadow:var(--shadow); }
#capList, #threadList { flex:1; min-height:0; overflow:auto; }
.side-title { font-size:12px; color:var(--muted); letter-spacing:1px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
.side-title::before { content:"◈"; color:var(--brand); font-size:10px; }
.cap-item { font-size:13px; padding:8px 10px; border-radius:10px; transition:background .15s; }
.cap-item:hover { background:#f1f5f9; }
.cap-item b { font-weight:600; }
.cap-item .d { font-size:11px; color:var(--muted); }
.cap-cat { font-size:11px; color:var(--brand); margin:8px 0 4px; font-weight:600; }
.chat { flex:1; display:flex; flex-direction:column; min-width:0; }
.agent-chat { flex:1; overflow:auto; background:var(--card); border:1px solid rgba(226,232,240,.9); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
.agent-msg { margin:0 0 14px; padding:11px 14px; border-radius:16px; max-width:88%; line-height:1.6; }
.agent-user { background:linear-gradient(135deg,#2563eb,#4f46e5); color:#fff; border:0; margin-left:auto; border-bottom-right-radius:6px; box-shadow:0 4px 12px rgba(37,99,235,.22); }
.agent-assist { background:#f8fafc; border:1px solid var(--line); border-bottom-left-radius:6px; }
.welcome { padding:38px 20px; text-align:center; color:var(--muted); }
.welcome-title { font-size:16px; font-weight:600; color:#334155; margin-bottom:6px; }
.welcome-sub { font-size:13px; margin-bottom:18px; }
.welcome-btns { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.welcome-btn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; cursor:pointer; text-align:left; min-width:160px; box-shadow:0 1px 3px rgba(15,23,42,.06); transition:border-color .15s, box-shadow .15s; }
.welcome-btn:hover { border-color:#2563eb; box-shadow:0 3px 10px rgba(37,99,235,.15); }
.wb-name { font-weight:600; color:#1e293b; font-size:13px; }
.wb-time { font-size:11px; color:var(--muted); margin-top:2px; }
.welcome-result { text-align:left; max-width:760px; margin:0 auto; }
.welcome-back { display:inline-block; margin-bottom:10px; cursor:pointer; color:#2563eb; font-size:13px; background:none; border:none; padding:0; }
.agent-body { white-space:pre-wrap; word-break:break-word; }
.agent-body .md { white-space:normal; }
.agent-body .md p { margin:0 0 8px; }
.agent-body .md h1, .agent-body .md h2, .agent-body .md h3 { margin:10px 0 6px; font-size:1.05em; }
.agent-body .md table { border-collapse:collapse; margin:8px 0; width:100%; }
.agent-body .md th, .agent-body .md td { border:1px solid var(--line); padding:5px 8px; font-size:13px; text-align:left; }
.agent-body .md th { background:#f1f5f9; font-weight:600; }
.agent-body .md code { background:#eef2ff; padding:1px 5px; border-radius:4px; font-size:12px; }
.agent-body .md pre { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:8px; overflow:auto; }
.agent-body .md pre code { background:transparent; color:inherit; padding:0; }
.agent-body .md ul, .agent-body .md ol { margin:6px 0; padding-left:20px; }
.agent-body .md a { color:var(--brand); }
.mermaid-render { margin:8px 0; overflow:auto; text-align:center; }
.echarts-render { margin:8px 0; width:100%; height:320px; }
.mermaid-render svg { max-width:100%; height:auto; }
.agent-meta { font-size:11px; color:var(--muted); margin-top:6px; }
.agent-input { display:flex; gap:8px; margin-top:12px; }
.agent-input textarea { flex:1; min-height:56px; resize:none; padding:11px 14px; border:1px solid #cbd5e1; border-radius:12px; font-family:inherit; font-size:14px; transition:border-color .2s, box-shadow .2s; }
.agent-input button { border:0; border-radius:12px; padding:0 24px; background:linear-gradient(135deg,#2563eb,#4f46e5); color:#fff; font-size:14px; cursor:pointer; box-shadow:0 4px 12px rgba(37,99,235,.25); transition:transform .15s, box-shadow .15s; }
.agent-input button:disabled { opacity:.55; cursor:wait; }
.thread-item { position:relative; padding:8px 10px; padding-right:74px; border-radius:10px; font-size:13px; cursor:pointer; transition:background .15s; }
.thread-actions { position:absolute; top:50%; right:6px; transform:translateY(-50%); display:flex; gap:4px; opacity:0; transition:opacity .15s; }
.thread-item:hover .thread-actions { opacity:1; }
.thread-act { border:0; background:#eef2ff; color:var(--brand); border-radius:6px; font-size:11px; padding:2px 7px; cursor:pointer; }
.thread-act.del { background:#fee2e2; color:#b91c1c; }
.thread-act:hover { filter:brightness(.96); }
.thread-item:hover { background:#f1f5f9; }
.thread-item.selected { background:linear-gradient(135deg,#eff6ff,#eef2ff); border:1px solid #bfdbfe; font-weight:500; }
.thread-item .t { font-size:11px; color:var(--muted); margin-top:2px; }
.clear-btn { border:0; background:#fee2e2; color:#b91c1c; border-radius:8px; cursor:pointer; font-size:12px; padding:4px 10px; line-height:1; margin-left:8px; }
.clear-btn:hover { background:#fecaca; }
.side { transition:width .22s ease, opacity .18s ease; }
.side.collapsed { width:0; padding:0; border:0; opacity:0; overflow:hidden; pointer-events:none; }

.right-resizer { width:6px; flex-shrink:0; cursor:col-resize; border-radius:3px; background:transparent; }
.right-resizer:hover { background:#bfdbfe; }
.right-col { width:272px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; min-height:0; }
.run-item { font-size:12px; border:1px solid var(--line); border-radius:11px; padding:8px 10px; background:#fff; box-shadow:0 2px 8px rgba(15,23,42,.04); }
.run-item .run-head { display:flex; justify-content:space-between; align-items:center; gap:6px; font-weight:600; color:#334155; }
.run-item .run-head::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--brand); flex-shrink:0; }
.run-item.run-done .run-head::before { background:#16a34a; }
.run-item .run-time { font-weight:400; color:var(--muted); font-size:11px; }
.run-item .run-sum { margin-top:3px; color:#64748b; white-space:pre-wrap; word-break:break-word; }
.run-sum .md, .run-sum { font-size:12px; }
.run-sum table { border-collapse:collapse; width:100%; margin:6px 0; }
.run-sum th, .run-sum td { border:1px solid var(--line); padding:4px 6px; font-size:11px; text-align:left; }
.run-sum th { background:#f1f5f9; font-weight:600; }
.run-item.run-done { border-color:#bbf7d0; background:#f0fdf4; }
.tr-panel { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.tr-head { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--muted); letter-spacing:1px; margin:0 0 8px; }
.tr-close { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; }
.tr-meta { font-size:11px; color:var(--muted); margin-bottom:8px; word-break:break-all; }
.tr-list { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:8px; }
.tr-line { font-size:12px; border:1px solid var(--line); border-radius:11px; padding:8px 10px; background:#fff; box-shadow:0 2px 8px rgba(15,23,42,.04); }
.tr-line .tr-time { font-size:11px; color:var(--muted); }
.tr-line .tr-role { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; margin:0 6px; background:#eef2ff; color:var(--brand); }
.tr-line .tr-role.sales { background:#ecfdf5; color:#16a34a; }
.tr-line .tr-role.other { background:#f1f5f9; color:var(--muted); }
.tr-line .tr-text { margin-top:3px; white-space:pre-wrap; word-break:break-word; color:#334155; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
.agent-step-body { margin-top:2px; color:#64748b; white-space:pre-wrap; word-break:break-word; max-height:120px; overflow:auto; background:#f8fafc; border-radius:6px; padding:6px 8px; }

.plan-card { margin:0 0 10px; border:1px solid #bfdbfe; background:#eff6ff; border-radius:10px; padding:10px 12px; font-size:12.5px; }
.plan-head { font-weight:600; color:#1d4ed8; margin-bottom:6px; }
.plan-steps { margin:0; padding-left:20px; }
.plan-steps li { margin:3px 0; }
.plan-tool { display:inline-block; background:#dbeafe; color:#1d4ed8; border-radius:6px; padding:0 7px; font-size:11px; margin-left:6px; }
.plan-purpose { color:#64748b; font-size:11.5px; }
.plan-verify { margin-top:6px; padding-top:6px; border-top:1px dashed #bfdbfe; color:#334155; font-size:12px; }
.pager-bar { display:flex; align-items:center; gap:10px; justify-content:center; margin:8px 0 2px; font-size:12px; color:var(--muted); }
.pager-btn { border:1px solid var(--line); background:#fff; color:var(--brand); border-radius:8px; padding:3px 12px; font-size:12px; font-family:inherit; cursor:pointer; transition:background .15s, border-color .15s; }
.pager-btn:hover:not(:disabled) { background:#eff6ff; border-color:#bfdbfe; }
.pager-btn:disabled { opacity:.45; cursor:not-allowed; }
.pager-info { white-space:nowrap; }
.modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal-box { width:min(940px,96vw); height:86vh; display:flex; flex-direction:column; background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(15,23,42,.3); padding:16px 18px; overflow:hidden; }
.jobs-layout { display:flex; flex:1; min-height:0; gap:14px; }
.jobs-list { width:250px; flex-shrink:0; overflow:auto; border-right:1px solid var(--line); padding-right:10px; display:flex; flex-direction:column; gap:8px; }
.jobs-item { border:1px solid var(--line); border-radius:10px; padding:9px 11px; cursor:pointer; font-size:12.5px; background:#fff; transition:border-color .15s, background .15s; }
.jobs-item:hover { border-color:#bfdbfe; background:#f8fafc; }
.jobs-item.active { border-color:#2563eb; background:#eff6ff; }
.jobs-item .ji-name { font-weight:600; }
.jobs-item .ji-time { color:#64748b; font-size:11px; margin-top:2px; }
.jobs-item .ji-tag { display:inline-block; background:#eef2ff; color:#1d4ed8; border-radius:6px; padding:0 6px; font-size:10.5px; margin-left:6px; }
.jobs-detail { flex:1; min-width:0; overflow:auto; display:flex; flex-direction:column; gap:12px; }
.jd-name { font-size:16px; font-weight:700; }
.jd-time { color:#1d4ed8; font-size:12.5px; }
.jd-desc { font-size:13px; color:#334155; }
.jd-actions { display:flex; gap:8px; flex-wrap:wrap; }
.jd-actions button { border:1px solid var(--line); background:#fff; color:#334155; border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; }
.jd-actions button:hover { background:#f1f5f9; }
.jd-actions button.primary { background:linear-gradient(135deg,#2563eb,#4f46e5); color:#fff; border:0; }
.jd-actions button.danger { background:#fee2e2; color:#b91c1c; border-color:#fecaca; }
.jd-runs { border-top:1px solid var(--line); padding-top:10px; }
.jd-runs .run-line { font-size:12px; color:#64748b; padding:3px 0; border-bottom:1px dashed #f1f5f9; }
.jd-runs .run-line.ok { color:#16a34a; } .jd-runs .run-line.err { color:#b91c1c; }
.job-form label { display:block; font-size:12px; color:#64748b; margin:8px 0 3px; }
.job-form input, .job-form select, .job-form textarea { width:100%; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
.job-form textarea { resize:vertical; }
.job-form .row2 { display:flex; gap:10px; } .job-form .row2 > div { flex:1; }
.job-add { border:1px dashed #93c5fd; background:#f8faff; color:#1d4ed8; border-radius:10px; padding:8px; text-align:center; cursor:pointer; font-size:12.5px; }
.modal-head { display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:15px; margin-bottom:12px; }
.modal-close { border:0; background:#f1f5f9; color:#334155; border-radius:8px; padding:4px 10px; cursor:pointer; font-size:13px; }
.job-card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fafbfc; }
.job-card .job-name { font-weight:600; color:#1d4ed8; }
.job-card .job-time { display:inline-block; background:#eef2ff; color:#1d4ed8; border-radius:6px; padding:1px 8px; font-size:11px; margin-left:8px; }
.job-card .job-desc { margin-top:5px; font-size:12.5px; color:#334155; }
.job-card .job-status { margin-top:6px; font-size:12px; color:#64748b; }
.job-card .job-status.ok { color:#16a34a; } .job-card .job-status.err { color:#b91c1c; }
.pager-pre { background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; white-space:pre-wrap; word-break:break-word; margin:8px 0; }
</style>
</head>
<body>
<header><h1>销售军师</h1><span class="sub">客户端 · 对话助销</span><span class="header-left"><button id="headerCapsBtn" class="hdr-btn active" title="显示/隐藏业务逻辑功能"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>业务逻辑功能</button><button id="headerThreadsBtn" class="hdr-btn active" title="显示/隐藏历史会话"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>历史会话</button></span><span class="nav"><button id="headerRunBtn" class="hdr-btn" title="显示/隐藏本轮任务"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>本轮任务</button><button id="headerTrBtn" class="hdr-btn" title="显示/隐藏对话原文"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>对话原文</button><button id="headerJobsBtn" class="hdr-btn" title="查看定时任务"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>定时任务</button><a href="/console">进入编排端</a></span></header>
<div class="client-layout">
<aside class="side" id="side">
<div class="side-block grow" id="capsBlock"><div class="side-title">业务逻辑功能</div><div id="capList">加载中…</div></div>
<div class="side-block" id="threadsBlock"><div class="side-title">历史会话<button id="clearThreadsBtn" class="clear-btn" title="一键清理全部历史会话">清理</button></div><button id="newBtn" class="secondary" style="width:100%;margin-bottom:8px">+ 新会话</button><div id="threadList"></div></div>
</aside>
<section class="chat">
<div class="agent-chat" id="chat"></div>
<div class="agent-input"><textarea id="goal" placeholder="下达目标，例如：列出当前待办并告诉我最该先跟进哪一条"></textarea><button id="sendBtn">发送</button></div>
</section>
<div id="rightResizer" class="right-resizer" title="拖动调整右侧面板宽度"></div>
<div class="right-col" id="rightCol">
<aside class="side-block tr-panel" id="runPanel" style="display:none">
<div class="tr-head"><span>本轮任务</span><button class="tr-close" onclick="hideRunPanel()">×</button></div>
<div class="tr-meta" id="runMeta"></div>
<div class="tr-list" id="runList"></div>
</aside>
<aside class="side-block tr-panel" id="trPanel" style="display:none">
<div class="tr-head"><span>对话原文</span><button class="tr-close" onclick="hideTrPanel()">×</button></div>
<div class="tr-meta" id="trMeta"></div>
<div class="tr-list" id="trList"></div>
</aside>
</div>
</div>
<div id="jobsModal" class="modal-mask" style="display:none">
  <div class="modal-box">
    <div class="modal-head"><span>⏰ 定时任务</span><button class="modal-close" onclick="closeJobsModal()">关闭</button></div>
    <div class="jobs-layout">
      <div class="jobs-list" id="jobsList">加载中…</div>
      <div class="jobs-detail" id="jobsDetail">请选择左侧任务,或新增一个定时任务</div>
    </div>
  </div>
</div>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>const $ = (id) => document.getElementById(id);
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
let trPager = null;
function renderTrPanel(meta, list, pager) {
  $("trMeta").textContent = meta || "";
  const box = $("trList"); box.innerHTML = "";
  if (!list || !list.length) { box.innerHTML = "<div class=\"t\">暂无原文</div>"; }
  for (const m of list) {
    const d = document.createElement("div"); d.className = "tr-line";
    const role = m.speakerRole === "customer" ? "客户" : m.speakerRole === "sales" ? "销售" : "其他";
    const name = m.speakerName ? "·" + escapeHtml(m.speakerName) : "";
    d.innerHTML = '<div><span class="tr-time">' + (m.spokenAt ? escapeHtml(new Date(m.spokenAt).toLocaleString()) : "—") + '</span><span class="tr-role ' + escapeHtml(m.speakerRole || "") + '">' + role + name + '</span></div><div class="tr-text">' + escapeHtml(m.content) + '</div>';
    box.appendChild(d);
  }
  trPager = pager || null;
  if (trPager && trPager.totalPages > 1) {
    const bar = document.createElement("div"); bar.className = "pager-bar";
    bar.innerHTML =
      '<button class="pager-btn" data-dir="-1"' + (trPager.page <= 1 ? " disabled" : "") + '>上一页</button>' +
      '<span class="pager-info">第 ' + trPager.page + '/' + trPager.totalPages + ' 页 · 共 ' + trPager.totalMessages + ' 条</span>' +
      '<button class="pager-btn" data-dir="1"' + (trPager.page >= trPager.totalPages ? " disabled" : "") + '>下一页</button>';
    Array.from(bar.querySelectorAll("button")).forEach((b) => { b.onclick = () => flipTrPage(Number(b.dataset.dir)); });
    box.appendChild(bar);
  }
  $("trPanel").style.display = "flex";
  $("headerTrBtn").classList.add("active");
  syncRightCol();
}
async function flipTrPage(dir) {
  if (!trPager) return;
  const target = trPager.page + dir;
  if (target < 1 || target > trPager.totalPages) return;
  try {
    const res = await api("/api/v1/agent/tools/conversation_query/page", {
      method: "POST",
      body: JSON.stringify({ params: { view: "load", conversationId: trPager.conversationId, page: target } }),
    });
    const det = res.details || {};

const JOB_DEFS = [
  { type: "morning_digest", name: "每日晨报", time: "每天 08:00", desc: "自动生成团队晨报:待办/到期任务、近24小时分析量、优先跟进客户,并推送通知日志。" },
  { type: "weekly_report", name: "每周周报", time: "每周一 09:00", desc: "汇总近 7 天经营数据:分析量、成交量额、任务完成率、热门意图、车型分布与销售漏斗。" },
  { type: "silent_wakeup", name: "沉默客户唤醒", time: "每天 08:30", desc: "为近 7 天未跟进(无会话/任务/试驾)的客户自动创建「唤醒回访」任务,已有待办自动跳过。" },
  { type: "reflection", name: "反思改进", time: "每周一 09:30", desc: "聚合近 7 天反思案例(评估低分/运行失败),把改进建议写入系统记忆「规则改进」,影响后续 Agent 行为。" },
];
const JOB_WEEK = ["", "一", "二", "三", "四", "五", "六", "日"];
function describeJobSchedule(j) {
  if (!j) return "";
  if (j.scheduleType === "interval") return (j.intervalUnit === "hour" ? "每 " + (j.intervalDays || 1) + " 小时 " : "每 " + (j.intervalDays || 1) + " 天 ") + (j.scheduleTime || "");
  if (j.scheduleType === "weekly") return "每周" + (JOB_WEEK[j.weekday || 1] || "一") + " " + (j.scheduleTime || "");
  return "每天 " + (j.scheduleTime || "");
}
let jobsState = { selected: null, customs: [], runs: [], editing: null, builtin: {} };
function openJobsModal() { $("jobsModal").style.display = "flex"; loadJobsData(); }
function closeJobsModal() { $("jobsModal").style.display = "none"; jobsState.editing = null; }
async function loadJobsData() {
  let runs = []; let customs = []; let builtin = {};
  try { const r = await api("/api/v1/automations?limit=100"); runs = r.runs || []; } catch {}
  try { const r = await api("/api/v1/automations/jobs"); customs = r.jobs || []; } catch {}
  try { const r = await api("/api/v1/automations/builtin"); builtin = r.settings || {}; } catch {}
  jobsState.runs = runs; jobsState.customs = customs; jobsState.builtin = builtin;
  renderJobsList();
  if (jobsState.selected) renderJobDetail();
  else $("jobsDetail").innerHTML = "请选择左侧任务,或点击上方「＋ 新增任务」创建一个定时任务";
}
function renderJobsList() {
  const box = $("jobsList"); box.innerHTML = "";
  const add = document.createElement("div"); add.className = "job-add"; add.textContent = "＋ 新增任务";
  add.onclick = () => { jobsState.editing = {}; renderJobForm(null); };
  box.appendChild(add);
  for (const def of JOB_DEFS) {
    box.appendChild(jobItem({ name: def.name, time: def.time, tag: "内置", active: jobsState.selected && jobsState.selected.kind === "builtin" && jobsState.selected.id === def.type, onClick: () => { jobsState.selected = { kind: "builtin", id: def.type }; jobsState.editing = null; renderJobsList(); renderJobDetail(); } }));
  }
  for (const c of jobsState.customs) {
    box.appendChild(jobItem({ name: c.name, time: describeJobSchedule(c), tag: "自定义", active: jobsState.selected && jobsState.selected.kind === "custom" && jobsState.selected.id === c.id, onClick: () => { jobsState.selected = { kind: "custom", id: c.id }; jobsState.editing = null; renderJobsList(); renderJobDetail(); } }));
  }
}
function jobItem(o) {
  const d = document.createElement("div"); d.className = "jobs-item" + (o.active ? " active" : "");
  d.innerHTML = '<div class="ji-name">' + escapeHtml(o.name) + '<span class="ji-tag">' + escapeHtml(o.tag) + "</span></div><div class=\"ji-time\">" + escapeHtml(o.time) + "</div>";
  d.onclick = o.onClick; return d;
}
function renderJobDetail() {
  const sel = jobsState.selected; const box = $("jobsDetail");
  if (!sel) return;
  if (jobsState.editing) { renderJobForm(jobsState.editing); return; }
  if (sel.kind === "builtin") {
    const def = JOB_DEFS.find((d) => d.type === sel.id);
    if (!def) return;
    const ben = jobsState.builtin[def.type] !== false;
    const runs = jobsState.runs.filter((r) => r.jobType === def.type).slice(0, 10);
    box.innerHTML = '<div class="jd-name">' + escapeHtml(def.name) + ' <span style="font-size:12px;color:' + (ben ? "#16a34a" : "#64748b") + '">' + (ben ? "启用中" : "已停用") + ' · 内置任务</span></div><div class="jd-time">⏰ ' + escapeHtml(def.time) + "</div><div class=\"jd-desc\">" + escapeHtml(def.desc) + '</div><div class="jd-actions"><button class="primary" onclick="runBuiltinJob(\'' + def.type + '\')">立即运行</button><button onclick="toggleBuiltinJob(\'' + def.type + '\',' + (ben ? "false" : "true") + ')">' + (ben ? "停用" : "启用") + '</button></div><div class="jd-runs"><b>最近执行记录</b>' + renderRuns(runs) + "</div>";
  } else {
    const c = jobsState.customs.find((x) => x.id === sel.id);
    if (!c) return;
    const action = JSON.parse(c.actionJson || "{}");
    const runs = jobsState.runs.filter((r) => r.jobType === "custom:" + c.id).slice(0, 10);
    box.innerHTML = '<div class="jd-name">' + escapeHtml(c.name) + ' <span style="font-size:12px;color:' + (c.enabled ? "#16a34a" : "#64748b") + '">' + (c.enabled ? "启用中" : "已停用") + '</span></div><div class="jd-time">⏰ ' + escapeHtml(describeJobSchedule(c)) + "</div><div class=\"jd-desc\">" + escapeHtml(c.description || "通知任务") + '<br>通知标题:' + escapeHtml(action.title || "") + '</div><div class="jd-actions"><button class="primary" onclick="runCustomJobNow(\'' + c.id + '\')">立即运行</button><button onclick="toggleCustomJob(\'' + c.id + '\',' + (c.enabled ? "false" : "true") + ')">' + (c.enabled ? "停用" : "启用") + '</button><button onclick="editCustomJob(\'' + c.id + '\')">编辑</button><button class="danger" onclick="deleteCustomJob(\'' + c.id + '\')">删除</button></div><div class="jd-runs"><b>最近执行记录</b>' + renderRuns(runs) + "</div>";
  }
}
function renderRuns(runs) {
  if (!runs.length) return '<div style="margin-top:6px">暂无执行记录</div>';
  return runs.map((r) => '<div class="run-line ' + (r.status === "success" ? "ok" : r.status === "error" ? "err" : "") + '">' + escapeHtml(String(r.runDate)) + " · " + (r.status === "success" ? "成功" : r.status === "error" ? "失败" : "跳过") + (r.summary ? " · " + escapeHtml(String(r.summary)) : "") + "</div>").join("");
}
async function toggleBuiltinJob(key, enabled) { try { await api("/api/v1/automations/builtin/" + key, { method: "PUT", body: JSON.stringify({ enabled: enabled }) }); } catch (e) { alert("操作失败:" + e.message); } loadJobsData(); }async function runBuiltinJob(type) { try { const r = await api("/api/v1/automations/run", { method: "POST", body: JSON.stringify({ job: type }) }); alert(r.summary || "已执行"); } catch (e) { alert("执行失败:" + e.message); } loadJobsData(); }
async function runCustomJobNow(id) { try { const r = await api("/api/v1/automations/jobs/" + id + "/run", { method: "POST" }); alert(r.summary || "已执行"); } catch (e) { alert("执行失败:" + e.message); } loadJobsData(); }
async function toggleCustomJob(id, enabled) { try { await api("/api/v1/automations/jobs/" + id, { method: "PUT", body: JSON.stringify({ enabled: enabled }) }); } catch (e) { alert("操作失败:" + e.message); } loadJobsData(); }
function editCustomJob(id) { const c = jobsState.customs.find((x) => x.id === id); if (c) { jobsState.editing = c; renderJobForm(c); } }
async function deleteCustomJob(id) { if (!window.confirm("确认删除该定时任务?")) return; try { await api("/api/v1/automations/jobs/" + id, { method: "DELETE" }); if (jobsState.selected && jobsState.selected.id === id) jobsState.selected = null; } catch (e) { alert("删除失败:" + e.message); } jobsState.editing = null; loadJobsData(); }
function renderJobForm(job) {
  const box = $("jobsDetail"); const isEdit = job && job.id;
  const j = job || {};
  const action = (job && job.actionJson) ? JSON.parse(job.actionJson) : {};
  const actKind = action.kind === "agent_goal" ? "agent_goal" : "notify";
  const isHour = j.scheduleType === "interval" && j.intervalUnit === "hour";
  box.innerHTML = '<div class="jd-name">' + (isEdit ? "编辑任务" : "新增任务") + '</div><div class="job-form">' +
    '<label>任务名称</label><input id="jfName" value="' + escapeHtml(j.name || "") + '">' +
    '<div class="row2"><div><label>类型</label><select id="jfType"><option value="interval"' + ((j.scheduleType === "interval" && !isHour) || !j.scheduleType ? " selected" : "") + '>每 N 天</option><option value="interval_hour"' + (isHour ? " selected" : "") + '>每 N 小时</option></select></div>' +
    '<div><label>时间(HH:MM)</label><input id="jfTime" value="' + escapeHtml(j.scheduleTime || "09:00") + '"></div></div>' +
    '<div id="jfIntervalRow"><label id="jfIntervalLabel">' + (isHour ? "间隔小时数(每 N 小时执行一次)" : "间隔天数(每 N 天执行一次)") + '</label><input id="jfIntervalDays" type="number" min="1" max="365" value="' + (j.intervalDays || 3) + '"></div>' +
    '<label>任务说明</label><textarea id="jfDesc" rows="2">' + escapeHtml(j.description || "") + '</textarea>' +
    '<div class="row2"><div><label>动作类型</label><select id="jfAction"><option value="notify"' + (actKind === "notify" ? " selected" : "") + '>通知</option><option value="agent_goal"' + (actKind === "agent_goal" ? " selected" : "") + '>Agent 自主执行</option></select></div></div>' +
    '<div id="jfNotifyBlock"><label>通知标题</label><input id="jfTitle" value="' + escapeHtml(action.title || "") + '"><label>通知内容</label><textarea id="jfContent" rows="2">' + escapeHtml(action.content || "") + '</textarea></div>' +
    '<div id="jfGoalBlock" style="display:none"><label>Agent 目标(到点由 Agent 自主执行,例如:生成近3天经营报告)</label><textarea id="jfGoal" rows="3">' + escapeHtml(action.goal || "") + '</textarea></div>' +
    '<div style="margin-top:10px;display:flex;gap:8px"><button class="primary" onclick="saveJob()">保存</button><button onclick="cancelJobForm()">取消</button></div></div>';
  const syncForm = () => {
    const t = $("jfType").value;
    $("jfIntervalLabel").textContent = t === "interval_hour" ? "间隔小时数(每 N 小时执行一次)" : "间隔天数(每 N 天执行一次)";
    const a = $("jfAction").value;
    $("jfNotifyBlock").style.display = a === "agent_goal" ? "none" : "";
    $("jfGoalBlock").style.display = a === "agent_goal" ? "" : "none";
  };
  $("jfType").onchange = syncForm;
  $("jfAction").onchange = syncForm;
  syncForm();
}
function cancelJobForm() { jobsState.editing = null; renderJobDetail(); }
async function saveJob() {
  const name = $("jfName").value.trim(); const time = $("jfTime").value.trim(); const type = $("jfType").value;
  if (!name || !/^\d{2}:\d{2}$/.test(time)) { alert("名称与时间(HH:MM)必填"); return; }
  const actKind = $("jfAction").value;
  let action;
  if (actKind === "agent_goal") {
    const goal = $("jfGoal").value.trim();
    if (!goal) { alert("请填写 Agent 目标"); return; }
    action = { kind: "agent_goal", goal: goal };
  } else {
    action = { kind: "notify", title: $("jfTitle").value.trim(), content: $("jfContent").value.trim() };
  }
  const editing = jobsState.editing || {};
  const body = { name: name, scheduleType: "interval", scheduleTime: time, intervalDays: Number($("jfIntervalDays").value) || 1, intervalUnit: type === "interval_hour" ? "hour" : "day", weekday: null, description: $("jfDesc").value.trim(), action: action, enabled: true };
  try {
    if (editing.id) { await api("/api/v1/automations/jobs/" + editing.id, { method: "PUT", body: JSON.stringify(body) }); jobsState.selected = { kind: "custom", id: editing.id }; }
    else { const r = await api("/api/v1/automations/jobs", { method: "POST", body: JSON.stringify(body) }); jobsState.selected = { kind: "custom", id: r.job.id }; }
    jobsState.editing = null; loadJobsData();
  } catch (e) { alert("保存失败:" + e.message); }
}
$("headerJobsBtn").addEventListener("click", openJobsModal);
$("jobsModal").addEventListener("click", (e) => { if (e.target === $("jobsModal")) closeJobsModal(); });
// ── 表格手动翻页:直接执行工具翻页,只替换表格原文,不经过大模型 ──
function attachPager(wait) {
  const body = wait.body;
  if (!body || !wait.pager) return;
  const tables = body.querySelectorAll("table");
  if (!tables.length) return;
  const table = tables[tables.length - 1];
  let bar = body.querySelector(".pager-bar");
  if (!bar) { bar = document.createElement("div"); bar.className = "pager-bar"; table.after(bar); }
  const st = wait.pager;
  bar.innerHTML =
    '<button class="pager-btn" data-dir="-1"' + (st.page <= 1 ? " disabled" : "") + '>上一页</button>' +
    '<span class="pager-info">第 ' + st.page + '/' + st.totalPages + ' 页 · 共 ' + st.totalRows + ' 条</span>' +
    '<button class="pager-btn" data-dir="1"' + (st.page >= st.totalPages ? " disabled" : "") + '>下一页</button>';
  Array.from(bar.querySelectorAll("button")).forEach((b) => { b.onclick = () => flipPager(wait, Number(b.dataset.dir)); });
}
async function flipPager(wait, dir) {
  const st = wait.pager;
  if (!st) return;
  const target = st.page + dir;
  if (target < 1 || target > st.totalPages) return;
  const bar = wait.body && wait.body.querySelector(".pager-bar");
  if (bar) { bar.style.opacity = "0.55"; bar.style.pointerEvents = "none"; }
  try {
    const res = await api("/api/v1/agent/tools/" + encodeURIComponent(st.toolName) + "/page", {
      method: "POST",
      body: JSON.stringify({ params: Object.assign({}, st.baseArgs, { page: target }) }),
    });
    const det = res.details || {};
    const md = (typeof det.rawTable === "string" && det.rawTable) ? det.rawTable : (typeof det.table === "string" ? det.table : "");
    const tables = wait.body.querySelectorAll("table");
    if (tables.length) {
      const table = tables[tables.length - 1];
      if (md) {
        const wrap = document.createElement("div"); wrap.className = "md"; wrap.innerHTML = renderMarkdown(md);
        table.replaceWith(wrap);
      } else {
        const txt = (res.content || []).map((c) => (c && c.text ? c.text : "")).join("\n");
        const pre = document.createElement("pre"); pre.className = "pager-pre"; pre.textContent = txt;
        table.replaceWith(pre);
      }
    }
    st.page = target;
    if (Number.isFinite(Number(det.totalPages)) && Number(det.totalPages) > 0) st.totalPages = Number(det.totalPages);
    if (Number.isFinite(Number(det.totalRows))) st.totalRows = Number(det.totalRows);
    attachPager(wait);
  } catch (e) {
    alert("翻页失败:" + e.message);
  } finally {
    if (bar) { bar.style.opacity = ""; bar.style.pointerEvents = ""; }
  }
}
syncRightCol();
loadCapabilities(); loadThreads(); renderWelcome();
