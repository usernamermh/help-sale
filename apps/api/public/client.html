<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>助销agent管理平台 · 客户端</title>
  <style>
    :root {
      --bg: #eef2f8;
      --bg2: #e2e8f0;
      --card: #fff;
      --line: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --brand: #2563eb;
      --brand2: #3b82f6;
      --shadow: 0 8px 28px rgba(15, 23, 42, .07);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #eef2f8 0%, #e7edf7 55%, #eef4ff 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 28px;
      background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 55%, #4f46e5 100%);
      color: #fff;
      box-shadow: 0 2px 16px rgba(30, 58, 138, .28);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    header h1::before {
      content: "";
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: linear-gradient(135deg, #60a5fa, #c4b5fd);
      box-shadow: 0 0 10px rgba(147, 197, 253, .8);
    }

    header .sub {
      font-size: 12px;
      opacity: .85;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 14px;
    }

    header .nav {
      margin-left: auto;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hdr-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, .30);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 4px rgba(15, 23, 42, .16);
      transition: all .2s ease;
    }

    .hdr-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hdr-btn:hover {
      background: rgba(255, 255, 255, .26);
      border-color: rgba(255, 255, 255, .55);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, .24);
    }

    .hdr-btn.active {
      background: #fff;
      color: #1d4ed8;
      border-color: #fff;
      box-shadow: 0 4px 14px rgba(30, 58, 138, .35);
    }

    .hdr-btn.active svg {
      stroke: #1d4ed8;
    }

    header .nav a {
      color: #fff;
      opacity: .9;
      text-decoration: none;
    }

    .client-layout {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: none;
      margin: 18px auto;
      padding: 0 24px;
      height: calc(100vh - 82px);
      min-height: 520px;
    }

    .side {
      width: 250px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      min-height: 0;
    }

    .side-block {
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1 1 0;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    #capList,
    #threadList {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .side-title {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .side-title::before {
      content: "◈";
      color: var(--brand);
      font-size: 10px;
    }

    .cap-item {
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 10px;
      transition: background .15s;
    }

    .cap-item:hover {
      background: #f1f5f9;
    }

    .cap-item b {
      font-weight: 600;
    }

    .cap-item .d {
      font-size: 11px;
      color: var(--muted);
    }

    .cap-cat {
      font-size: 11px;
      color: var(--brand);
      margin: 8px 0 4px;
      font-weight: 600;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .agent-chat {
      flex: 1;
      overflow: auto;
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .agent-msg {
      margin: 0 0 14px;
      padding: 11px 14px;
      border-radius: 16px;
      max-width: 88%;
      line-height: 1.6;
    }

    .agent-user {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      border: 0;
      margin-left: auto;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, .22);
    }

    .agent-assist {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .welcome {
      padding: 38px 20px;
      text-align: center;
      color: var(--muted);
    }

    .welcome-title {
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .welcome-sub {
      font-size: 13px;
      margin-bottom: 18px;
    }

    .welcome-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .welcome-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      text-align: left;
      min-width: 160px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
      transition: border-color .15s, box-shadow .15s;
    }

    .welcome-btn:hover {
      border-color: #2563eb;
      box-shadow: 0 3px 10px rgba(37, 99, 235, .15);
    }

    .wb-name {
      font-weight: 600;
      color: #1e293b;
      font-size: 13px;
    }

    .wb-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .welcome-result {
      text-align: left;
      max-width: 1120px;
      margin: 0 auto;
    }

    .welcome-pick {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .welcome-select {
      min-width: 260px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      color: #334155;
    }

    .welcome-back {
      display: inline-block;
      margin-bottom: 10px;
      cursor: pointer;
      color: #2563eb;
      font-size: 13px;
      background: none;
      border: none;
      padding: 0;
    }

    .agent-body {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .agent-body .md {
      white-space: normal;
    }

    .agent-body .md p {
      margin: 0 0 8px;
    }

    .agent-body .md h1,
    .agent-body .md h2,
    .agent-body .md h3 {
      margin: 10px 0 6px;
      font-size: 1.05em;
    }

    .agent-body .md table {
      border-collapse: collapse;
      margin: 8px 0;
      width: 100%;
    }

    .agent-body .md th,
    .agent-body .md td {
      border: 1px solid var(--line);
      padding: 5px 8px;
      font-size: 13px;
      text-align: left;
    }

    .agent-body .md th {
      background: #f1f5f9;
      font-weight: 600;
    }

    .agent-body .md code {
      background: #eef2ff;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .agent-body .md pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
    }

    .agent-body .md pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .agent-body .md ul,
    .agent-body .md ol {
      margin: 6px 0;
      padding-left: 20px;
    }

    .agent-body .md a {
      color: var(--brand);
    }

    .mermaid-render {
      margin: 8px 0;
      overflow: auto;
      text-align: center;
    }

    .echarts-render {
      margin: 8px 0;
      width: 100%;
      max-width: 100%;
      overflow: auto;
      text-align: center;
    }

    .echarts-render svg {
      max-width: 100%;
      height: auto;
    }

    .mermaid-render svg {
      max-width: 100%;
      height: auto;
    }

    .agent-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .agent-input {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .agent-input textarea {
      flex: 1;
      min-height: 56px;
      resize: none;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    .agent-input button {
      border: 0;
      border-radius: 12px;
      padding: 0 24px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, .25);
      transition: transform .15s, box-shadow .15s;
    }

    .agent-input button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .thread-item {
      position: relative;
      padding: 8px 10px;
      padding-right: 74px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }

    .thread-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity .15s;
    }

    .thread-item:hover .thread-actions {
      opacity: 1;
    }

    .thread-act {
      border: 0;
      background: #eef2ff;
      color: var(--brand);
      border-radius: 6px;
      font-size: 11px;
      padding: 2px 7px;
      cursor: pointer;
    }

    .thread-act.del {
      background: #fee2e2;
      color: #b91c1c;
    }

    .thread-act:hover {
      filter: brightness(.96);
    }

    .thread-item:hover {
      background: #f1f5f9;
    }

    .thread-item.selected {
      background: linear-gradient(135deg, #eff6ff, #eef2ff);
      border: 1px solid #bfdbfe;
      font-weight: 500;
    }

    .thread-item .t {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .clear-btn {
      border: 0;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 10px;
      line-height: 1;
      margin-left: 8px;
    }

    .clear-btn:hover {
      background: #fecaca;
    }

    .side {
      transition: width .22s ease, opacity .18s ease;
    }

    .side.collapsed {
      width: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .right-resizer {
      width: 6px;
      flex-shrink: 0;
      cursor: col-resize;
      border-radius: 3px;
      background: transparent;
    }

    .right-resizer:hover {
      background: #bfdbfe;
    }

    .right-col {
      width: 272px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .run-item {
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 8px 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    }

    .run-item .run-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #334155;
    }

    .run-item .run-head::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      flex-shrink: 0;
    }

    .run-item.run-done .run-head::before {
      background: #16a34a;
    }

    .run-item .run-time {
      font-weight: 400;
      color: var(--muted);
      font-size: 11px;
    }

    .run-detail {
      margin: 5px 2px 2px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .run-item .run-sum {
      margin-top: 3px;
      color: #64748b;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .run-sum .md,
    .run-sum {
      font-size: 12px;
    }

    .run-sum table {
      border-collapse: collapse;
      width: 100%;
      margin: 6px 0;
    }

    .run-sum th,
    .run-sum td {
      border: 1px solid var(--line);
      padding: 4px 6px;
      font-size: 11px;
      text-align: left;
    }

    .run-sum th {
      background: #f1f5f9;
      font-weight: 600;
    }

    .run-item.run-done {
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .tr-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .tr-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      margin: 0 0 8px;
    }

    .tr-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
    }

    .tr-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .tr-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tr-line {
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 8px 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    }

    .tr-line .tr-time {
      font-size: 11px;
      color: var(--muted);
    }

    .tr-line .tr-role {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      margin: 0 6px;
      background: #eef2ff;
      color: var(--brand);
    }

    .tr-line .tr-role.sales {
      background: #ecfdf5;
      color: #16a34a;
    }

    .tr-line .tr-role.other {
      background: #f1f5f9;
      color: var(--muted);
    }

    .tr-line .tr-text {
      margin-top: 3px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #334155;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .agent-step-body {
      margin-top: 2px;
      color: #64748b;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow: auto;
      background: #f8fafc;
      border-radius: 6px;
      padding: 6px 8px;
    }

    .kb-group { margin-bottom: 12px; }
    .kb-group-head { font-weight: 600; font-size: 12.5px; color: #475569; margin-bottom: 6px; }
    .kb-card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: #fff; font-size: 12.5px; }
    .kb-card.kb-pending { border-left: 3px solid #f59e0b; }
    .kb-card.kb-inprogress { border-left: 3px solid #3b82f6; }
    .kb-card.kb-done { border-left: 3px solid #16a34a; }
    .kb-card.kb-error { border-left: 3px solid #dc2626; }
    .kb-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .kb-goal { color: #475569; margin: 4px 0; line-height: 1.5; }
    .kb-tools { color: #94a3b8; font-size: 11.5px; margin: 2px 0; }
    .kb-result { color: #166534; background: #f0fdf4; border-radius: 6px; padding: 6px 8px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
    .kb-error { color: #991b1b; background: #fef2f2; border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
    .tr-text.tr-highlight { font-weight: 700; background: #fef9c3; border-radius: 4px; padding: 2px 4px; }
    .plan-card {
      margin: 0 0 10px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
    }

    .plan-head {
      font-weight: 600;
      color: #1d4ed8;
      margin-bottom: 6px;
    }

    .plan-steps {
      margin: 0;
      padding-left: 20px;
    }

    .plan-steps li {
      margin: 3px 0;
    }

    .plan-tool {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 0 7px;
      font-size: 11px;
      margin-left: 6px;
    }

    .plan-purpose {
      color: #64748b;
      font-size: 11.5px;
    }

    .plan-verify {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #bfdbfe;
      color: #334155;
      font-size: 12px;
    }

    .pager-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin: 8px 0 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .pager-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--brand);
      border-radius: 8px;
      padding: 3px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .pager-btn:hover:not(:disabled) {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .pager-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .pager-info {
      white-space: nowrap;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      width: min(1280px, 98vw);
      height: 88vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .3);
      padding: 16px 18px;
      overflow: hidden;
    }

    .jobs-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 14px;
    }

    .jobs-list {
      width: 320px;
      flex-shrink: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .jobs-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
      font-size: 12.5px;
      background: #fff;
      transition: border-color .15s, background .15s;
    }

    .jobs-item:hover {
      border-color: #bfdbfe;
      background: #f8fafc;
    }

    .jobs-item.active {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .jobs-item .ji-name {
      font-weight: 600;
    }

    .jobs-item .ji-time {
      color: #64748b;
      font-size: 11px;
      margin-top: 2px;
    }

    .jobs-item .ji-tag {
      display: inline-block;
      background: #eef2ff;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 0 6px;
      font-size: 10.5px;
      margin-left: 6px;
    }

    .jobs-detail {
      flex: 1;
      min-width: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .jd-name {
      font-size: 16px;
      font-weight: 700;
    }

    .jd-time {
      color: #1d4ed8;
      font-size: 12.5px;
    }

    .jd-desc {
      font-size: 13px;
      color: #334155;
    }

    .jd-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .jd-actions button {
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      border-radius: 8px;
      padding: 5px 12px;

<script>const $ = (id) => document.getElementById(id);
    function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    let trPager = null;
    let trHighlights = {}; // conversationId -> Set<seq> 抽取命中加粗
    function renderTrPanel(meta, list, pager, highlightKey) {
      $("trMeta").textContent = meta || "";
      const box = $("trList"); box.innerHTML = "";
      if (!list || !list.length) { box.innerHTML = "<div class=\"t\">暂无原文</div>"; }
      for (const m of list) {
        const d = document.createElement("div"); d.className = "tr-line";
        const role = m.speakerRole === "customer" ? "客户" : m.speakerRole === "sales" ? "销售" : "其他";
        const name = m.speakerName ? "·" + escapeHtml(m.speakerName) : "";
        const seqNum = Number(m.seq || m.index || 0);
        const hl = highlightKey && trHighlights[highlightKey] && trHighlights[highlightKey].has(seqNum);
        d.innerHTML = '<div><span class="tr-time">' + (m.spokenAt ? escapeHtml(new Date(m.spokenAt).toLocaleString()) : "—") + '</span><span class="tr-role ' + escapeHtml(m.speakerRole || "") + '">' + role + name + '</span></div><div class="tr-text' + (hl ? " tr-highlight" : "") + '">' + escapeHtml(m.content) + '</div>';
        box.appendChild(d);
      }
      trPager = pager || null;
      if (trPager && trPager.totalPages > 1) {
        const bar = document.createElement("div"); bar.className = "pager-bar";
        bar.innerHTML =
          '<button class="pager-btn" data-dir="-1"' + (trPager.page <= 1 ? " disabled" : "") + '>上一页</button>' +
          '<span class="pager-info">第 ' + trPager.page + '/' + trPager.totalPages + ' 页 · 共 ' + trPager.totalMessages + ' 条</span>' +
          '<button class="pager-btn" data-dir="1"' + (trPager.page >= trPager.totalPages ? " disabled" : "") + '>下一页</button>';
        Array.from(bar.querySelectorAll("button")).forEach((b) => { b.onclick = () => flipTrPage(Number(b.dataset.dir)); });
        box.appendChild(bar);
      }
      $("trPanel").style.display = "flex";
      $("headerTrBtn").classList.add("active");
      syncRightCol();
    }
    async function flipTrPage(dir) {
      if (!trPager) return;
      const target = trPager.page + dir;
      if (target < 1 || target > trPager.totalPages) return;
      try {
        const res = await api("/api/v1/agent/tools/conversation_query/page", {
          method: "POST",
          body: JSON.stringify({ params: { view: "load", conversationId: trPager.conversationId, page: target } }),
        });
        const det = res.details || {};
        trPager.page = target;
        if (Number.isFinite(Number(det.totalPages)) && Number(det.totalPages) > 0) trPager.totalPages = Number(det.totalPages);
        if (Number.isFinite(Number(det.totalMessages))) trPager.totalMessages = Number(det.totalMessages);
        renderTrPanel("会话 " + String(trPager.conversationId || "").slice(0, 10) + "…", det.messages || [], trPager, trPager.conversationId);
      } catch (e) {
        alert("翻页失败:" + e.message);
      }
    }
    function hideTrPanel() { $("trPanel").style.display = "none"; $("headerTrBtn").classList.remove("active"); syncRightCol(); }
    function hideKanbanPanel() { $("kanbanPanel").style.display = "none"; $("headerKanbanBtn").classList.remove("active"); syncRightCol(); }
    function showKanbanPanel() { $("kanbanPanel").style.display = "flex"; $("headerKanbanBtn").classList.add("active"); loadKanban(); syncRightCol(); }
    async function loadKanban() {
      const box = $("kanbanList");
      // 未打开任何会话:看板为空(按会话隔离,不展示其他会话的历史卡片)
      if (!currentThreadId) {
        $("kanbanMeta").textContent = "共 0 张卡片";
        box.innerHTML = "<div class=\"mini\">请先选择或创建一个会话</div>";
        return;
      }
      try {
        const r = await api("/api/v1/kanban?threadId=" + encodeURIComponent(currentThreadId));
        const cards = r.cards || [];
        $("kanbanMeta").textContent = "共 " + cards.length + " 张卡片";
        if (!cards.length) { box.innerHTML = "<div class=\"mini\">看板为空</div>"; return; }
        const statusOrder = ["pending", "inprogress", "done", "error"];
        const groups = {};
        for (const s of statusOrder) groups[s] = cards.filter((c) => c.status === s);
        const labels = { pending: "待执行", inprogress: "执行中", done: "已完成", error: "出错" };
        box.innerHTML = "";
        for (const s of statusOrder) {
          if (!groups[s].length) continue;
          const g = document.createElement("div");
          g.className = "kb-group";
          g.innerHTML = '<div class="kb-group-head">' + labels[s] + ' (' + groups[s].length + ')' + '</div>';
          for (const card of groups[s]) {
            const d = document.createElement("div"); d.className = "kb-card kb-" + card.status;
            d.innerHTML = '<div class="kb-card-head"><b>' + escapeHtml(card.id) + " " + escapeHtml(card.title || "") + '</b><span class="badge">' + (labels[card.status] || card.status) + '</span></div>'
              + (card.goal ? '<div class="kb-goal">' + escapeHtml(card.goal) + '</div>' : "")
              + (card.tools && card.tools.length ? '<div class="kb-tools">工具: ' + escapeHtml(card.tools.join(", ")) + '</div>' : "")
              + (card.result ? renderKanbanResult(card.result, card.id, !!kanbanExpanded[card.id]) : "")
              + (card.error ? '<div class="kb-error">错误: ' + escapeHtml(card.error) + '</div>' : "");
            g.appendChild(d);
          }
          box.appendChild(g);
        }
      } catch (e) { box.innerHTML = "加载失败:" + escapeHtml(e.message); }
    }
    // 看板长结果折叠:超过 200 字只显示前 200 字,可展开/收起
    // 看板长结果折叠:超过 200 字只显示前 200 字,可展开/收起(状态记忆,轮询刷新后保持)
    function toggleKanbanResult(btn, id, expanded) {
      const span = btn.previousElementSibling;
      if (expanded && span) {
        kanbanExpanded[id] = true;
        span.textContent = btn.getAttribute("data-full") || span.textContent;
        btn.style.display = "none";
      } else {
        kanbanExpanded[id] = false;
      }
    }
    function renderKanbanResult(text, id, expanded) {
      const MAX = 200;
      const full = String(text || "");
      if (full.length <= MAX) return '<div class="kb-result">结果: ' + escapeHtml(full) + '</div>';
      const data = "data-full=\"" + escapeHtml(full).replace(/"/g, "&quot;") + "\"";
      if (expanded) {
        return '<div class="kb-result">结果: <span class="kb-collapse">' + escapeHtml(full) + '</span> <button class="kb-toggle" onclick="toggleKanbanResult(this, \'' + id + '\', false)" ' + data + '>收起</button></div>';
      }
      const preview = escapeHtml(full.slice(0, MAX)) + "…";
      return '<div class="kb-result">结果: <span class="kb-collapse">' + preview + '</span> <button class="kb-toggle" onclick="toggleKanbanResult(this, \'' + id + '\', true)" ' + data + '>展开</button></div>';
    }
    function showTrPanel() { $("trPanel").style.display = "flex"; $("headerTrBtn").classList.add("active"); syncRightCol(); } function renderMarkdown(text) {
      try {
        if (typeof marked !== "undefined" && marked.parse) {
          const html = marked.parse(text);
          if (typeof DOMPurify !== "undefined") return DOMPurify.sanitize(html);
          return html;
        }
      } catch { }
      return escapeHtml(text);
    }
    function loadScript(srcs, onLoaded) {
      if (!srcs.length) { if (onLoaded) onLoaded(); return; }
      const s = document.createElement("script");
      s.src = srcs[0];
      s.onload = () => { if (onLoaded) onLoaded(); };
      s.onerror = () => loadScript(srcs.slice(1), onLoaded);
      document.head.appendChild(s);
    }
    function ensureMermaid() {
      if (window.mermaid) return Promise.resolve();
      return new Promise((resolve) => {
        loadScript(["/vendor/mermaid.min.js", "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"], () => {
          try { if (window.mermaid) window.mermaid.initialize({ startOnLoad: false, theme: "base", securityLevel: "strict" }); } catch { }
          resolve();
        });
      });
    }
    async function renderMermaidBlocks(root) {
      const codes = Array.from(root.querySelectorAll("code.language-mermaid"));
      if (!codes.length) return;
      await ensureMermaid();
      if (!window.mermaid) return;
      for (const code of codes) {
        try {
          const src = code.textContent || "";
          const id = "mmd" + Math.random().toString(36).slice(2, 8);
          const out = await window.mermaid.render(id, src);
          const wrap = document.createElement("div");
          wrap.className = "mermaid-render";

    /* 图表直渲染器见下方 renderChartDirect 系列 */
    function renderFunnelSVG(wrap, opt) {
      wrap.className = "echarts-render funnel";
      const series = ((opt.series || []).find((s) => s && s.type === "funnel")) || (opt.series || [])[0] || {};
      const items = (Array.isArray(series.data) ? series.data : []).map((d) => ({ name: d && d.name != null ? String(d.name) : "", value: Number((d && d.value) || 0) }));
      if (!items.length) return false;
      const title = opt.title && opt.title.text ? String(opt.title.text) : "";
      const max = Math.max(1, ...items.map((i) => i.value));
      const palette = Array.isArray(opt.color) && opt.color.length ? opt.color : null;
      const W = 760;
      const stageH = 72;
      const H = 34 + items.length * stageH;
      const cx = W / 2;
      const topW = W - 170;
      const widths = items.map((i) => Math.max(10, (i.value / max) * topW));
      let svg = "";
      if (title) svg += '<text x="' + cx + '" y="18" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">' + escapeHtml(title) + "</text>";
      for (let i = 0; i < items.length; i++) {
        const yTop = 34 + i * stageH;
        const yBot = 34 + (i + 1) * stageH;
        const wTop = widths[i];
        const wBot = i < items.length - 1 ? widths[i + 1] : widths[i];
        const pct = Math.round((items[i].value / max) * 100);
        const hue = 220 - i * 26;
        const fill = palette ? palette[i % palette.length] : "hsl(" + hue + ",70%," + (62 - i * 4) + "%)";
        svg += '<polygon points="' + (cx - wTop / 2) + ',' + yTop + ' ' + (cx + wTop / 2) + ',' + yTop + ' ' + (cx + wBot / 2) + ',' + yBot + ' ' + (cx - wBot / 2) + ',' + yBot + '" fill="' + fill + '" stroke="#ffffff" stroke-width="2"/>';
        svg += '<text x="' + (cx - wTop / 2 - 10) + '" y="' + (yTop + stageH / 2 + 5) + '" text-anchor="end" font-size="13" fill="#334155">' + escapeHtml(items[i].name) + "</text>";
        svg += '<text x="' + (cx + wTop / 2 + 10) + '" y="' + (yTop + stageH / 2 + 5) + '" text-anchor="start" font-size="13" fill="#334155">' + items[i].value + " · " + pct + "%</text>";
      }
      wrap.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:640px;height:auto;display:block;margin:0 auto" role="img">' + svg + "</svg>";
      return true;
    }

    async function streamRun(goal, wait, steps, signal) {
      deltaBuf = "";

        method: "POST",
        headers: { "Content-Type": "application/json", "x-tenant-id": "t_demo" },
        body: JSON.stringify({ goal }),
        signal,
      });
      if (!res.ok) { let msg = "HTTP " + res.status; try { msg = (await res.json()).message || msg; } catch { } throw new Error(msg); }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).replace(/\r$/, "");
          buf = buf.slice(idx + 1);
          if (!line.trim()) continue;
          let evt;
          try { evt = JSON.parse(line); } catch { continue; }
          handleStreamEvent(evt, wait, steps);

          if (done || Date.now() > deadline) break;
        if (stoppedByUser) {
          wait.body.textContent = "已停止本轮任务。";
          multiState = null;
          return;
        }

        action = { kind: "notify", title: $("jfTitle").value.trim(), content: $("jfContent").value.trim() };
      }
      const editing = jobsState.editing || {};
      const description = $("jfDesc").value.trim();
      let body;
      if (type === "once") {
        const onceDate = $("jfDate").value.trim();
        if (!onceDate) { alert("请选择执行日期"); return; }
        body = { name: name, scheduleType: "once", scheduleTime: time, onceDate: onceDate, intervalDays: null, intervalUnit: "day", weekday: null, description: description, action: action, enabled: true };
      } else {
        body = { name: name, scheduleType: "interval", scheduleTime: time, intervalDays: Number($("jfIntervalDays").value) || 1, intervalUnit: type === "interval_hour" ? "hour" : "day", weekday: null, description: description, action: action, enabled: true };
      }
      try {
        if (editing.id) { await api("/api/v1/automations/jobs/" + editing.id, { method: "PUT", body: JSON.stringify(body) }); jobsState.selected = { kind: "custom", id: editing.id }; }
        else { const r = await api("/api/v1/automations/jobs", { method: "POST", body: JSON.stringify(body) }); jobsState.selected = { kind: "custom", id: r.job.id }; }
        jobsState.editing = null; loadJobsData();
      } catch (e) { alert("保存失败:" + e.message); }
    }
    $("headerKeywordsBtn").addEventListener("click", () => { $("keywordsModal").style.display = "flex"; loadKwCats(); loadKeywords(); });
    $("headerJobsBtn").addEventListener("click", openJobsModal);
    $("jobsModal").addEventListener("click", (e) => { if (e.target === $("jobsModal")) closeJobsModal(); });
    // ── 表格手动翻页:直接执行工具翻页,只替换表格原文,不经过大模型 ──
    function attachPager(wait) {
      const body = wait.body;
      if (!body || !wait.pager) return;
      const tables = body.querySelectorAll("table");
      if (!tables.length) return;
      const table = tables[tables.length - 1];
      let bar = body.querySelector(".pager-bar");
      if (!bar) { bar = document.createElement("div"); bar.className = "pager-bar"; table.after(bar); }
      const st = wait.pager;
      bar.innerHTML =
        '<button class="pager-btn" data-dir="-1"' + (st.page <= 1 ? " disabled" : "") + '>上一页</button>' +
        '<span class="pager-info">第 ' + st.page + '/' + st.totalPages + ' 页 · 共 ' + st.totalRows + ' 条</span>' +
        '<button class="pager-btn" data-dir="1"' + (st.page >= st.totalPages ? " disabled" : "") + '>下一页</button>';
      Array.from(bar.querySelectorAll("button")).forEach((b) => { b.onclick = () => flipPager(wait, Number(b.dataset.dir)); });
    }
    async function flipPager(wait, dir) {
      const st = wait.pager;
      if (!st) return;
      const target = st.page + dir;
      if (target < 1 || target > st.totalPages) return;
      const bar = wait.body && wait.body.querySelector(".pager-bar");
      if (bar) { bar.style.opacity = "0.55"; bar.style.pointerEvents = "none"; }
      try {
        const res = await api("/api/v1/agent/tools/" + encodeURIComponent(st.toolName) + "/page", {
          method: "POST",
          body: JSON.stringify({ params: Object.assign({}, st.baseArgs, { page: target }) }),
        });
        const det = res.details || {};
        const md = (typeof det.rawTable === "string" && det.rawTable) ? det.rawTable : (typeof det.table === "string" ? det.table : "");
        const tables = wait.body.querySelectorAll("table");
        if (tables.length) {
          const table = tables[tables.length - 1];
          if (md) {
            const wrap = document.createElement("div"); wrap.className = "md"; wrap.innerHTML = renderMarkdown(md);
            table.replaceWith(wrap);
          } else {
            const txt = (res.content || []).map((c) => (c && c.text ? c.text : "")).join("\n");
            const pre = document.createElement("pre"); pre.className = "pager-pre"; pre.textContent = txt;
            table.replaceWith(pre);
          }
        }
        st.page = target;
        if (Number.isFinite(Number(det.totalPages)) && Number(det.totalPages) > 0) st.totalPages = Number(det.totalPages);
        if (Number.isFinite(Number(det.totalRows))) st.totalRows = Number(det.totalRows);
        attachPager(wait);
      } catch (e) {
        alert("翻页失败:" + e.message);
      } finally {
        if (bar) { bar.style.opacity = ""; bar.style.pointerEvents = ""; }
      }
    }
    syncRightCol();
    loadCapabilities(); loadThreads(); renderWelcome();
  </script>
</body>
